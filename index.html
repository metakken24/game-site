<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- 文字コードをUTF-8に設定します -->
    <meta charset="UTF-8">

    <!-- スマートフォンでも画面幅に合わせて表示します -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザのタブに表示される名前です -->
    <title>My Game Site</title>
</head>

<body>

    <!-- サイトのタイトル -->
    <h1>🎮 My Game Site</h1>

    <!-- サイトの説明 -->
    <p>無料で遊べるブラウザゲーム</p>

    <!-- ゲーム一覧 -->
    <h2>Games</h2>

    <!-- 今回作ったゲーム -->
    <h3>DODGE GAME</h3>

    <p>落ちてくる敵を避け続けるゲームです。</p>

    <!-- あとでゲームを起動するボタンを作ります -->
    <button>PLAY</button>

</body>

</html>
